[project]
name = "wetrun"
version = "0.1.0"
description = "Restore self-hosted services from existing backups and verify they actually work"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.scripts]
wetrun = "wetrun.__main__:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
